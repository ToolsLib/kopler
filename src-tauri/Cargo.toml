[package]
name = "kopler"
version = "0.1.5"
description = "A small local desktop scratchpad for notes and next steps"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "kopler_lib"
crate-type = ["lib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-window-state", "dep:tauri-plugin-updater", "dep:webview2-com", "dep:windows-core", "dep:clipboard-win", "dep:raw-window-handle", "dep:x11rb"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
unicode-casefold = "0.2"
base64 = "0.22"
png = "0.18"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39", optional = true }
windows-core = { version = "0.62", optional = true }
clipboard-win = { version = "5.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
x11rb = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[bin]]
name = "kopler"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "updater-check"
path = "examples/updater-check.rs"
required-features = ["desktop"]
