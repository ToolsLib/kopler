name: Release builds
run-name: Release candidates — ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate release versions, tag, and notes
        id: version
        run: npm run release:check
      - run: npm run test:release
      - name: Prepare a draft release or candidate
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_TAG="candidate-${RELEASE_VERSION}-${GITHUB_RUN_ID}"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/kopler-draft-status"; then
            test "$(cat "$RUNNER_TEMP/kopler-draft-status")" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          else
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "Kopler $RELEASE_VERSION candidate" --notes-file "docs/releases/v$RELEASE_VERSION.md"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "Kopler $RELEASE_VERSION" --notes-file "docs/releases/v$RELEASE_VERSION.md"
            fi
          fi

  build:
    needs: validate
    permissions:
      contents: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
            targets: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: linux
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2 file xvfb dbus-x11 xdotool openbox procps x11-utils
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Windows interface tests
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Build and stage native installers
        run: npm run release:${{ matrix.platform }}
      - name: Verify the universal macOS app
        if: runner.os == 'macOS'
        run: |
          mount_dir=$(mktemp -d "$RUNNER_TEMP/kopler-dmg.XXXXXX")
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach .release/${{ needs.validate.outputs.version }}/macos/Kopler_${{ needs.validate.outputs.version }}_macos_universal.dmg -readonly -nobrowse -mountpoint "$mount_dir"
          lipo "$mount_dir/Kopler.app/Contents/MacOS/kopler" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$mount_dir/Kopler.app"
      - name: Linux release launch and shortcut smoke check
        if: runner.os == 'Linux'
        env:
          KOPLER_TEST_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/release/kopler
          KOPLER_SMOKE_DIR: ${{ runner.temp }}/kopler-release-smoke
        run: dbus-run-session -- sh scripts/linux-smoke.sh
      - name: Upload packages directly to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          PACKAGE_DIR: .release/${{ needs.validate.outputs.version }}/${{ matrix.platform }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "$PACKAGE_DIR"/Kopler_* --clobber

  assemble:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download packages from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          gh release download "$RELEASE_TAG" --pattern 'Kopler_*' --dir .release/combined
      - name: Require every platform and write combined checksums
        run: node scripts/release.mjs verify-assets .release/combined
      - name: Upload combined checksums to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" .release/combined/SHA256SUMS.txt --clobber

  draft-release:
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Finalize the verified draft, never a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 5 || { echo 'Expected four packages and combined checksums.' >&2; exit 1; }
          title="Kopler $RELEASE_VERSION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then title="$title candidate"; fi
          gh release edit "$RELEASE_TAG" --draft --title "$title" --notes-file "docs/releases/v$RELEASE_VERSION.md"
